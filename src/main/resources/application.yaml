spring:
  application:
    name: Expense_Tracker
app:  
  jwt:
    secret: ${JWT_SECRET}
    access-token-minutes: 15
    refresh-token-days: 7
  verification:
    pin-secret: ${PIN_SECRET}
    pin-ttl-minutes: 10
    max-attempts: 5
    resend-cooldown-minutes: 5
  mail:
    from: ${MAIL_FROM:no-reply@localhost}